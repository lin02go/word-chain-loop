<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f3f0e7">
  <title>重置密码 · Word Loop</title>
  <link rel="icon" href="assets/icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="reset-password.css?v=1">
</head>
<body>
  <main class="reset-shell">
    <header class="reset-brand"><span lang="en">WORD LOOP</span><span aria-hidden="true">｜</span><span>词环</span></header>
    <section class="reset-card" aria-labelledby="resetTitle">
      <p class="reset-kicker">ACCOUNT RECOVERY</p>
      <h1 id="resetTitle">设置新密码</h1>
      <p class="reset-intro">新密码只会发送到词环的账户接口，不会保存在这个页面中。链接使用一次后立即失效。</p>

      <form id="resetPasswordForm">
        <label for="resetPassword">新密码</label>
        <input id="resetPassword" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
        <p class="reset-hint">至少 10 个字符。</p>

        <label for="resetPasswordConfirm">再输入一次</label>
        <input id="resetPasswordConfirm" name="passwordConfirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>

        <label class="reset-show"><input id="resetPasswordShow" type="checkbox"><span>显示密码</span></label>
        <button id="resetPasswordSubmit" type="submit">确认重置</button>
        <p class="reset-status" id="resetPasswordStatus" role="status" aria-live="polite"></p>
      </form>

      <div class="reset-success" id="resetPasswordSuccess" hidden>
        <h2>密码已更新</h2>
        <p>旧登录会话已经注销。请使用新密码重新登录。</p>
        <a href="word-chain-game">返回游戏</a>
      </div>
    </section>
    <footer>WORD LOOP · SECURE ACCOUNT RECOVERY</footer>
  </main>
  <script src="reset-password.js?v=1" defer></script>
</body>
</html>
